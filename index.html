/* ====== Nuevo estilo ====== */
:root{--bg1:#4a1a8c;--bg2:#24093f;--bg3:#12052b;--a1:#ff9a4a;--a2:#ff3d7f;--cy:#36d6ff;--vi:#7b4dff;--felt:#1d0a38}
body{background:radial-gradient(130% 80% at 50% -10%,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%) fixed;font-family:'Nunito',system-ui,sans-serif}
button{font-family:'Nunito',system-ui,sans-serif;font-weight:800;background:linear-gradient(180deg,#ffa356,#ff4f7b);color:#fff;box-shadow:0 3px 0 #a3204a,0 6px 14px #0005;text-shadow:0 1px 0 #0003}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #a3204a}

.off{background:#ffffff14!important;color:#fff!important;box-shadow:none!important}
.bk{background:#ffffff14!important;box-shadow:none!important;color:#fff;font-size:15px;padding:8px 14px}
.box{background:#ffffff10;border:1px solid #ffffff1f;border-radius:16px}
#menu h2,.sec{font-family:'Lilita One',Georgia,serif;font-weight:400;font-size:30px;letter-spacing:.5px;margin:6px 0 12px;background:linear-gradient(90deg,#fff,#ffd0e0);-webkit-background-clip:text;background-clip:text;color:transparent}

.pf{display:flex;align-items:center;gap:8px;background:#ffffff12;box-shadow:none;padding:4px 12px 4px 4px;border-radius:999px;font-size:15px;max-width:48%;overflow:hidden;white-space:nowrap}

.plus{width:32px;height:32px;padding:0;border-radius:50%;font-size:22px;line-height:1}
.logo{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 16px}
.logo img{width:70px;border-radius:10px;box-shadow:0 8px 22px #0007;transform:rotate(-8deg)}
.ttl{font-family:'Lilita One',Georgia,serif;font-size:50px;line-height:1;background:linear-gradient(180deg,#fff 20%,#ffc0d6 55%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6d1a4a)}

/* marcos animados */
.av.f-fuego,.av.f-arcoiris,.av.f-venezuela,.av.f-real{position:relative;isolation:isolate;overflow:visible}
.av.f-fuego{border:2px solid #ffd54a;box-shadow:0 0 6px 2px #ff6a00,0 0 16px 4px #ff3d0088!important;animation:none}
.av.f-fuego::before{content:'';position:absolute;inset:-24%;border-radius:50%;z-index:-1;background:conic-gradient(#ff2a00,#ffb300,#ff5500,#ffe14a,#ff2a00,#ff8c00,#ff2a00);filter:blur(2.5px);-webkit-mask:radial-gradient(circle,transparent 50%,#000 57%,#000 66%,transparent 71%);mask:radial-gradient(circle,transparent 50%,#000 57%,#000 66%,transparent 71%);animation:fspin 1.1s linear infinite}
.av.f-fuego::after{content:'';position:absolute;left:-12%;right:-12%;top:-42%;height:72%;z-index:-1;background:radial-gradient(ellipse 17% 62% at 18% 100%,#ffd54a,#ff6a00 50%,transparent 72%),radial-gradient(ellipse 15% 80% at 50% 100%,#fff2a0,#ff8c00 45%,transparent 72%),radial-gradient(ellipse 17% 62% at 82% 100%,#ffd54a,#ff5a00 50%,transparent 72%),radial-gradient(ellipse 10% 45% at 34% 100%,#ffb300,transparent 70%),radial-gradient(ellipse 10% 45% at 66% 100%,#ffb300,transparent 70%);filter:blur(1.2px);transform-origin:50% 100%;animation:ftongue .28s infinite alternate}
@keyframes fspin{to{transform:rotate(360deg)}}
@keyframes ftongue{0%{transform:scaleY(.82) skewX(-5deg);opacity:.85}100%{transform:scaleY(1.12) skewX(5deg);opacity:1}}
.av.f-neon{border:3px solid #a8fbff;box-shadow:0 0 8px #36d6ff,0 0 18px #36d6ff,inset 0 0 6px #36d6ff!important;animation:neonp 1.2s infinite alternate}
@keyframes neonp{to{box-shadow:0 0 4px #36d6ff,0 0 10px #ff3df0,inset 0 0 4px #ff3df0}}
.av.f-hielo{border:3px solid #dff6ff;box-shadow:0 0 10px #9adfff,0 0 2px #fff,inset 0 0 8px #e6f7ff!important}
.av.f-arcoiris{border:0}
.av.f-arcoiris::before,.av.f-venezuela::before,.av.f-real::before{content:'';position:absolute;inset:-5px;border-radius:50%;z-index:-1;background:conic-gradient(#ff3d3d,#ffb000,#3dff6a,#3dc5ff,#b04dff,#ff3d3d);animation:fspin 2.5s linear infinite}
.av.f-venezuela{border:0}.av.f-venezuela::before{background:conic-gradient(#ffcc00 0 33%,#00247d 0 66%,#cf142b 0);animation:none}
.av.f-real{border:2px solid #ffd84a}.av.f-real::before{background:conic-gradient(#8a4fff,#ffd84a,#b58cff,#ffd84a,#8a4fff);inset:-6px;animation:fspin 3s linear infinite;box-shadow:0 0 12px #b58cff}

const APROG={p1:['games',1],w1:['wins',1],w10:['wins',10],w50:['wins',50],c1:['caidas',1],c25:['caidas',25],rey:['rey',1],ml:['ml',1],k10:['cantos',10],mc5:['mc',5],q3:['quem',3],tv:['triv',1],r3:['maxStreak',3],tu:[null,1]};
function achReady(){store.ach=store.ach||[];store.achR=store.achR||[];return store.achR}
function checkAch(){const s=ST(),R=achReady();const nw=ACH.filter(a=>!store.ach.includes(a[0])&&!R.includes(a[0])&&a[3](s));
nw.forEach((a,i)=>{R.push(a[0]);setTimeout(()=>{toast('🏆 ¡Logro conseguido! '+a[1]+' · Reclámalo en Logros');sfx.chime()},i*2800)});if(nw.length)save()}
function claimAch(id){const R=achReady(),a=ACH.find(x=>x[0]==id);if(!a||!R.includes(id))return;store.achR=R.filter(x=>x!=id);store.ach.push(id);store.gold+=a[4];save();sfx.caida(2);toast('🏆 +'+a[4]+' de oro por «'+a[1]+'»');showMenu(curView)}
function claimAllAch(){const R=[...achReady()];let g=0;R.forEach(id=>{const a=ACH.find(x=>x[0]==id);if(a){store.ach.push(id);g+=a[4]}});store.achR=[];store.gold+=g;save();sfx.caida(3);toast('🏆 +'+g+' de oro por tus logros');showMenu(curView)}
function statsHTML(bk){const s=ST(),pct=s.games?Math.round(s.wins/s.games*100):0;
const L=[['🎴 Partidas jugadas',s.games],['🥇 Partidas ganadas',s.wins+' ('+pct+'%)'],['⚡ Racha actual',s.streak],['🔥 Mejor racha',s.maxStreak],['💥 Caídas dadas',s.caidas],['🤴 Caídas de rey',s.rey],['🧹 Mesas limpias',s.ml],['🎵 Cantos ganados',s.cantos],['⭐ Mejor canto',s.best+' puntos'],['🕵️ Mal cantos descubiertos',s.mc],['👀 «Se quemó» que dijiste',s.quem],['💎 Trivilines',s.triv],['💰 Oro ganado en partidas',s.gold]];
return bk+'<h2>📊 Estadísticas</h2>'+L.map(x=>`<div class="box" style="display:flex;justify-content:space-between;gap:10px;margin:6px 0"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}
function logrosHTML(bk){const s=ST(),got=store.ach||[],R=achReady();
return bk+`<h2>🏅 Logros</h2><p class="sb">${got.length} de ${ACH.length} reclamados. Cada logro da oro una sola vez.</p>`+(R.length>1?`<button class="mb" onclick="claimAllAch()">🏆 Reclamar todo (+${R.reduce((t,id)=>t+(ACH.find(a=>a[0]==id)||[0,0,0,0,0])[4],0)} de oro)</button>`:'')
+[...ACH].sort((a,b)=>(R.includes(b[0])-R.includes(a[0]))||(got.includes(a[0])-got.includes(b[0]))).map(a=>{const ok=got.includes(a[0]),rd=R.includes(a[0]),pr=APROG[a[0]],cur=pr&&pr[0]?Math.min(s[pr[0]]||0,pr[1]):(ok||rd?1:0),tot=pr?pr[1]:1;
return `<div class="box ach${rd?' rdy':''}${ok?' done':''}"><div class="aci">${ok?'✅':rd?'🏆':'🔒'}</div><div style="flex:1;min-width:0"><b>${a[1]}</b><br><span class="sub">${a[2]}</span>${!ok&&!rd&&tot>1?`<div class="apb"><i style="width:${Math.round(cur/tot*100)}%"></i></div><span class="sub">${cur}/${tot}</span>`:''}</div>${rd?`<button class="sm" onclick="claimAch('${a[0]}')">Reclamar<br>+${a[4]} 💰</button>`:ok?'<span class="sub">Reclamado</span>':`<b>+${a[4]} 💰</b>`}</div>`}).join('')}
const DR=[50,75,100,125,150,200,300];
function dayStr(o){const d=new Date();d.setDate(d.getDate()+(o||0));return d.toLocaleDateString('en-CA')}
function dailyInfo(){const d=store.daily||{last:'',streak:0},today=dayStr(0);const can=d.last!=today;const k=can?(d.last==dayStr(-1)?(d.streak%7)+1:1):d.streak;return{can,k,r:DR[(k||1)-1],nextR:DR[(k%7)]}}
function claimDaily(){const i=dailyInfo();if(!i.can)return;store.daily={last:dayStr(0),streak:i.k};store.gold+=i.r;save();sfx.chime();toast('🎁 Día '+i.k+': +'+i.r+' de oro');showMenu(curView=='premios'?'premios':'home')}

{t:'Repetir el canto',x:'¡Muy importante! Cada vez que tires una carta tienes que repetir tu canto. En la última carta se dice «vista mi ronda». Toca «🔔 ronda» y luego tira una carta.',hand:[[3,2],[7,1]],btns:['🔔 ronda'],seq:[{want:{btn:'🔔 ronda'},ok:'¡Eso! Ahora tira.'},{want:{anycard:1},ok:'Te queda una carta: di «vista mi ronda».',btns:['🔔 vista mi ronda']},{want:{btn:'🔔 vista mi ronda'},ok:'¡Vista mi ronda! Ahora tira la última.'},{want:{anycard:1},ok:'¡Perfecto! Tu ronda vale. (Si tiras primero las dos cartas iguales, la ronda ya se vio y no hace falta repetirla).'}]},

const TSL={en:[['The cards','Caída is played with 40 Spanish cards: 1 to 7, the jack (10), the horse (11) and the king (12), in four suits: coins, cups, swords and clubs. The first to reach the table points (24, 30 or 40) wins. Play goes to the right.'],['The opening: 1 or 4','The dealer puts 4 cards on the table and first says "one" (going up 1-2-3-4) or "four" (going down 4-3-2-1). If a card lands on its number it "hits" and scores those points. Tap «4 ↓».'],['Capturing cards','On your turn you play a card. If there is an equal one on the table you take it, plus the ones that follow in sequence (5, 6, 7…). Tap your 5.'],['Caída!','If the previous player just played a card (the glowing one) and you have an equal one, that is a CAÍDA and you score: 1 to 7 is worth 1, jack 2, horse 3 and king 4. The rival just played the king. Hit it!'],['Clean table','If you take every card on the table it is a CLEAN TABLE: +4 points. It does not count in the last round of the deck. Tap the card that empties the table.'],['Calls','Some combinations of your 3 cards score points: pair, lookout, straight, registry (1, 11 and 12), flush (same suit) and big or small house. Call them BEFORE playing your first card. You have 3, 3 and 7: tap the call and then play a card.'],['Repeat your call','Very important! Every time you play a card you must repeat your call. On the last card you say "seen my…". Tap the bell button and then play a card.'],['Burned','If someone calls and does NOT repeat it on the next card, you can say "Burned!": you win 1 point and their call no longer counts. If nobody says it, the call still counts. Stay alert! Rafa called flush and played his second card without repeating it…'],['False call','Calling something you do not have is a FALSE CALL. If you catch it you win 2 points and their call is void (yours still counts). If they did have it, the point goes to them. Rafa called flush and has already played a 4 of cups and a 6 of swords…'],['I call it','If your call reaches the winning points, tap «I call it!» before playing: all calls are compared and if yours is the best you win at once.'],['Trivilín','Three equal cards is TRIVILÍN: it wins the game! You win instantly, and if the rival had no points it counts double. You have three 5s: tap trivilín.'],['End of the hand','When the deck runs out, whoever captured last takes what is left on the table. Then the cards are counted: every card above 20 is worth 1 point (13 or 14 with 3 players, 10 in 4-player solo).'],['Ready!','Now you know the basics. Play a game against the AI «With hints»: it tells you which call you have and reminds you to repeat it.']],
pt:[['As cartas','Caída se joga com 40 cartas espanholas: do 1 ao 7, o valete (10), o cavalo (11) e o rei (12), em quatro naipes: ouros, copas, espadas e paus. Vence quem chegar primeiro aos pontos da mesa (24, 30 ou 40). Joga-se para a direita.'],['A abertura: 1 ou 4','Quem dá as cartas coloca 4 na mesa e antes diz "um" (subindo 1-2-3-4) ou "quatro" (descendo 4-3-2-1). Se uma carta cai no seu número, ela "acerta" e soma esses pontos. Toque «4 ↓».'],['Capturar cartas','Na sua vez você joga uma carta. Se houver uma igual na mesa, você a leva, e também as que seguirem em sequência (5, 6, 7…). Toque o seu 5.'],['Caída!','Se o jogador anterior acabou de jogar uma carta (a que brilha) e você tem uma igual, é CAÍDA e você ganha pontos: do 1 ao 7 vale 1, o valete 2, o cavalo 3 e o rei 4. O rival jogou o rei. Faça a caída!'],['Mesa limpa','Se você levar todas as cartas da mesa é MESA LIMPA: +4 pontos. Não vale na última rodada do baralho. Toque a carta que deixa a mesa vazia.'],['Os cantos','Algumas combinações das suas 3 cartas valem pontos: par, vigia, sequência, registro (1, 11 e 12), flor (mesmo naipe) e casa grande ou pequena. Canta-se ANTES de jogar a primeira carta. Você tem 3, 3 e 7: toque o canto e depois jogue uma carta.'],['Repetir o canto','Muito importante! Cada vez que jogar uma carta, repita o seu canto. Na última carta diz-se "vista minha…". Toque o sino e depois jogue uma carta.'],['Queimou','Se alguém canta e NÃO repete na carta seguinte, você pode dizer "Queimou!": ganha 1 ponto e o canto dele não vale mais. Se ninguém disser, o canto continua valendo. Fique atento! Rafa cantou flor e jogou a segunda carta sem repetir…'],['Canto falso','Cantar o que não tem é CANTO FALSO. Se você descobrir, ganha 2 pontos e o canto dele não vale (o seu sim). Mas se ele tinha, o ponto é dele. Rafa cantou flor e já jogou um 4 de copas e um 6 de espadas…'],['Peço canto','Se com os pontos do seu canto você chega à meta, toque «Peço canto!» antes de jogar: os cantos são comparados e, se o seu for o melhor, você vence na hora.'],['Trivilín','Três cartas iguais é TRIVILÍN: vence a partida! Você ganha na hora e, se o rival não tinha pontos, vale dobrado. Você tem três 5: toque trivilín.'],['Fim da mão','Quando o baralho acaba, quem capturou por último leva o que sobrou na mesa. Depois contam-se as cartas: cada carta acima de 20 vale 1 ponto (13 ou 14 com 3 jogadores, 10 no individual de 4).'],['Pronto!','Agora você sabe o básico. Jogue uma partida contra a IA «Com ajudas»: ela diz qual canto você tem e lembra de repetir.']]};
const EXPT={en:{ronda:'2 equal cards and any other. Worth 1 point for 1-7, 2 for the 10, 3 for the 11 and 4 for the 12.','vigía':'A pair plus a card right above or below it. Worth 7 points.',patrulla:'3 cards in a row. Worth 6 points.',registro:'The 1, the 11 and the 12. Worth 8 points.','casa grande':'Two 12s and a 1. Worth 12 points.','casa chica':'Two 1s and a 12. Worth 12 points.',flor:'3 cards of the same suit. Worth 10 points.','flor patrulla':'A straight of the same suit: call flush and straight. Worth 16 points.','flor registro':'A registry of the same suit: call flush and registry. Worth 18 points.','trivilín':'3 equal cards. You win the game!'},
pt:{ronda:'2 cartas iguais e outra qualquer. Vale 1 ponto do 1 ao 7, 2 o 10, 3 o 11 e 4 o 12.','vigía':'Um par mais uma carta seguida ou anterior. Vale 7 pontos.',patrulla:'3 cartas seguidas. Vale 6 pontos.',registro:'O 1, o 11 e o 12. Vale 8 pontos.','casa grande':'Dois 12 e um 1. Vale 12 pontos.','casa chica':'Dois 1 e um 12. Vale 12 pontos.',flor:'3 cartas do mesmo naipe. Vale 10 pontos.','flor patrulla':'Sequência do mesmo naipe: canta-se flor e sequência. Vale 16 pontos.','flor registro':'Registro do mesmo naipe: canta-se flor e registro. Vale 18 pontos.','trivilín':'3 cartas iguais. Você vence a partida!'}};

Object.assign(TSL,{fr:[["Les cartes","La Caída se joue avec 40 cartes espagnoles : du 1 au 7, le valet (10), le cavalier (11) et le roi (12), en quatre couleurs : deniers, coupes, épées et bâtons. Le premier à atteindre les points de la table (24, 30 ou 40) gagne. On joue vers la droite."],["L'ouverture : 1 ou 4","Le donneur pose 4 cartes sur la table et annonce d'abord « un » (on monte 1-2-3-4) ou « quatre » (on descend 4-3-2-1). Si une carte tombe sur son numéro, elle « touche » et rapporte ces points. Touche « 4 ↓ »."],["Capturer des cartes","À ton tour tu joues une carte. S'il y en a une égale sur la table, tu la prends, ainsi que celles qui suivent dans l'ordre (5, 6, 7…). Touche ton 5."],["Caída !","Si le joueur précédent vient de jouer une carte (celle qui brille) et que tu en as une égale, c'est une CAÍDA et tu marques : du 1 au 7 vaut 1, le valet 2, le cavalier 3 et le roi 4. L'adversaire vient de jouer le roi. Fais la caída !"],["Table nette","Si tu prends toutes les cartes de la table, c'est TABLE NETTE : +4 points. Ça ne compte pas lors de la dernière donne. Touche la carte qui vide la table."],["Les annonces","Certaines combinaisons de tes 3 cartes rapportent des points : paire, vigie, suite, registre (1, 11 et 12), couleur (même couleur) et grande ou petite maison. On les annonce AVANT de jouer sa première carte. Tu as 3, 3 et 7 : touche l'annonce puis joue une carte."],["Répéter l'annonce","Très important ! À chaque carte jouée, tu dois répéter ton annonce. Sur la dernière carte on dit « vu ma… ». Touche la cloche puis joue une carte."],["Brûlé","Si quelqu'un annonce et ne répète PAS sur la carte suivante, tu peux dire « Brûlé ! » : tu gagnes 1 point et son annonce ne compte plus. Si personne ne le dit, l'annonce compte toujours. Reste attentif ! Rafa a annoncé couleur et a joué sa deuxième carte sans répéter…"],["Fausse annonce","Annoncer ce qu'on n'a pas, c'est une FAUSSE ANNONCE. Si tu la découvres, tu gagnes 2 points et son annonce ne compte pas (la tienne oui). Mais s'il l'avait, le point est pour lui. Rafa a annoncé couleur et a déjà joué un 4 de coupes et un 6 d'épées…"],["J'annonce","Si les points de ton annonce te font atteindre l'objectif, touche « J'annonce ! » avant de jouer : on compare les annonces et si la tienne est la meilleure, tu gagnes tout de suite."],["Trivilín","Trois cartes égales, c'est le TRIVILÍN : il gagne la partie ! Tu gagnes aussitôt, et si l'adversaire n'avait aucun point, ça compte double. Tu as trois 5 : touche trivilín."],["Fin de la donne","Quand la pioche est vide, le dernier à avoir capturé prend ce qui reste sur la table. Puis on compte les cartes : chaque carte au-delà de 20 vaut 1 point (13 ou 14 à 3 joueurs, 10 en individuel à 4)."],["Prêt !","Tu connais les bases. Joue une partie contre l'IA « Avec aides » : elle te dit quelle annonce tu as et te rappelle de la répéter."]],
de:[["Die Karten","Caída wird mit 40 spanischen Karten gespielt: 1 bis 7, Bube (10), Pferd (11) und König (12), in vier Farben: Münzen, Kelche, Schwerter und Stäbe. Wer zuerst die Punkte des Tisches erreicht (24, 30 oder 40), gewinnt. Gespielt wird nach rechts."],["Die Eröffnung: 1 oder 4","Der Geber legt 4 Karten auf den Tisch und sagt vorher „eins“ (aufsteigend 1-2-3-4) oder „vier“ (absteigend 4-3-2-1). Fällt eine Karte auf ihre Zahl, „trifft“ sie und bringt diese Punkte. Tippe auf „4 ↓“."],["Karten nehmen","In deinem Zug spielst du eine Karte. Liegt eine gleiche auf dem Tisch, nimmst du sie, dazu die folgenden in Reihe (5, 6, 7…). Tippe auf deine 5."],["Caída!","Hat der vorige Spieler gerade eine Karte gespielt (die leuchtende) und du hast eine gleiche, ist das eine CAÍDA und du punktest: 1 bis 7 zählt 1, Bube 2, Pferd 3, König 4. Der Gegner hat gerade den König gespielt. Schlag zu!"],["Leerer Tisch","Nimmst du alle Karten vom Tisch, ist das LEERER TISCH: +4 Punkte. Im letzten Geben zählt es nicht. Tippe auf die Karte, die den Tisch leert."],["Ansagen","Manche Kombinationen deiner 3 Karten bringen Punkte: Paar, Wache, Straße, Register (1, 11 und 12), Flush (gleiche Farbe) sowie großes oder kleines Haus. Angesagt wird VOR der ersten Karte. Du hast 3, 3 und 7: tippe die Ansage und spiele dann eine Karte."],["Ansage wiederholen","Sehr wichtig! Bei jeder gespielten Karte musst du deine Ansage wiederholen. Bei der letzten Karte sagt man „gesehen mein…“. Tippe auf die Glocke und spiele dann eine Karte."],["Verbrannt","Sagt jemand an und wiederholt es bei der nächsten Karte NICHT, kannst du „Verbrannt!“ sagen: du bekommst 1 Punkt und seine Ansage zählt nicht mehr. Sagt es niemand, zählt die Ansage weiter. Pass auf! Rafa hat Flush angesagt und seine zweite Karte ohne Wiederholung gespielt…"],["Falsche Ansage","Etwas anzusagen, das man nicht hat, ist eine FALSCHE ANSAGE. Deckst du sie auf, bekommst du 2 Punkte und seine Ansage zählt nicht (deine schon). Hatte er sie doch, bekommt er den Punkt. Rafa hat Flush angesagt und schon eine 4 Kelche und eine 6 Schwerter gespielt…"],["Ich sage an","Erreichst du mit den Punkten deiner Ansage das Ziel, tippe vor dem Spielen auf „Ich sage an!“: die Ansagen werden verglichen, und ist deine die beste, gewinnst du sofort."],["Trivilín","Drei gleiche Karten sind TRIVILÍN: das gewinnt die Partie! Du gewinnst sofort, und hatte der Gegner keine Punkte, zählt es doppelt. Du hast drei 5er: tippe auf Trivilín."],["Ende der Runde","Ist der Stapel leer, nimmt der letzte, der Karten genommen hat, den Rest vom Tisch. Dann wird gezählt: jede Karte über 20 bringt 1 Punkt (13 oder 14 bei 3 Spielern, 10 im Einzelspiel zu viert)."],["Fertig!","Jetzt kennst du die Grundlagen. Spiel eine Partie gegen die KI „Mit Hilfen“: sie zeigt dir deine Ansage und erinnert dich ans Wiederholen."]],
it:[["Le carte","La Caída si gioca con 40 carte spagnole: dall'1 al 7, il fante (10), il cavallo (11) e il re (12), in quattro semi: denari, coppe, spade e bastoni. Vince chi arriva per primo ai punti del tavolo (24, 30 o 40). Si gioca verso destra."],["L'apertura: 1 o 4","Chi distribuisce mette 4 carte sul tavolo e prima dice «uno» (salendo 1-2-3-4) o «quattro» (scendendo 4-3-2-1). Se una carta cade sul suo numero «prende» e vale quei punti. Tocca «4 ↓»."],["Prendere le carte","Al tuo turno giochi una carta. Se sul tavolo ce n'è una uguale la prendi, insieme a quelle che seguono in ordine (5, 6, 7…). Tocca il tuo 5."],["Caída!","Se il giocatore precedente ha appena giocato una carta (quella che brilla) e tu ne hai una uguale, è CAÍDA e fai punti: dall'1 al 7 vale 1, il fante 2, il cavallo 3 e il re 4. L'avversario ha appena giocato il re. Fai la caída!"],["Tavolo pulito","Se prendi tutte le carte del tavolo è TAVOLO PULITO: +4 punti. Non vale nell'ultima distribuzione. Tocca la carta che svuota il tavolo."],["Le dichiarazioni","Alcune combinazioni delle tue 3 carte valgono punti: coppia, vedetta, scala, registro (1, 11 e 12), colore (stesso seme) e casa grande o piccola. Si dichiarano PRIMA di giocare la prima carta. Hai 3, 3 e 7: tocca la dichiarazione e poi gioca una carta."],["Ripetere la dichiarazione","Molto importante! Ogni volta che giochi una carta devi ripetere la dichiarazione. All'ultima carta si dice «vista la mia…». Tocca la campanella e poi gioca una carta."],["Bruciato","Se qualcuno dichiara e NON ripete alla carta successiva, puoi dire «Bruciato!»: vinci 1 punto e la sua dichiarazione non vale più. Se nessuno lo dice, la dichiarazione vale ancora. Stai attento! Rafa ha dichiarato colore e ha giocato la seconda carta senza ripetere…"],["Dichiarazione falsa","Dichiarare ciò che non hai è una DICHIARAZIONE FALSA. Se la scopri vinci 2 punti e la sua non vale (la tua sì). Ma se l'aveva davvero, il punto va a lui. Rafa ha dichiarato colore e ha già giocato un 4 di coppe e un 6 di spade…"],["Dichiaro","Se con i punti della tua dichiarazione raggiungi l'obiettivo, tocca «Dichiaro!» prima di giocare: si confrontano le dichiarazioni e se la tua è la migliore vinci subito."],["Trivilín","Tre carte uguali sono il TRIVILÍN: vince la partita! Vinci subito, e se l'avversario non aveva punti vale doppio. Hai tre 5: tocca trivilín."],["Fine della mano","Quando il mazzo finisce, chi ha preso per ultimo si porta ciò che resta sul tavolo. Poi si contano le carte: ogni carta oltre le 20 vale 1 punto (13 o 14 in 3 giocatori, 10 nell'individuale a 4)."],["Pronto!","Ora conosci le basi. Gioca una partita contro l'IA «Con aiuti»: ti dice quale dichiarazione hai e ti ricorda di ripeterla."]],
ru:[["Карты","Каида играется 40 испанскими картами: от 1 до 7, валет (10), конь (11) и король (12), четырёх мастей: монеты, кубки, мечи и жезлы. Побеждает тот, кто первым наберёт очки стола (24, 30 или 40). Ход идёт вправо."],["Открытие: 1 или 4","Раздающий кладёт на стол 4 карты и перед этим говорит «один» (по возрастанию 1-2-3-4) или «четыре» (по убыванию 4-3-2-1). Если карта выпадает на свой номер, она «попадает» и даёт эти очки. Нажми «4 ↓»."],["Взятие карт","В свой ход ты кладёшь карту. Если на столе есть такая же, ты её забираешь вместе со следующими по порядку (5, 6, 7…). Нажми свою 5."],["Каида!","Если предыдущий игрок только что положил карту (она светится), а у тебя есть такая же — это КАИДА, и ты получаешь очки: от 1 до 7 — 1, валет 2, конь 3, король 4. Соперник только что положил короля. Бей!"],["Чистый стол","Если забираешь все карты со стола — это ЧИСТЫЙ СТОЛ: +4 очка. В последней раздаче не считается. Нажми карту, которая очистит стол."],["Объявления","Некоторые сочетания твоих 3 карт дают очки: пара, дозор, стрит, регистр (1, 11 и 12), флеш (одна масть), большой или малый дом. Объявлять нужно ДО первой карты. У тебя 3, 3 и 7: нажми объявление и сыграй карту."],["Повтори объявление","Очень важно! С каждой сыгранной картой нужно повторять объявление. На последней карте говорят «видна моя…». Нажми колокольчик и сыграй карту."],["Сгорело","Если кто-то объявил и НЕ повторил на следующей карте, можно сказать «Сгорело!»: ты получаешь 1 очко, а его объявление больше не считается. Если никто не скажет, объявление остаётся в силе. Будь внимателен! Рафа объявил флеш и сыграл вторую карту, не повторив…"],["Ложное объявление","Объявить то, чего нет, — это ЛОЖНОЕ ОБЪЯВЛЕНИЕ. Если разоблачишь, получишь 2 очка, а его объявление не засчитается (твоё — да). Но если у него было, очко получает он. Рафа объявил флеш и уже сыграл 4 кубков и 6 мечей…"],["Объявляю","Если очки твоего объявления доводят тебя до цели, нажми «Объявляю!» до хода: объявления сравнивают, и если твоё лучшее — ты сразу побеждаешь."],["Тривилин","Три одинаковые карты — это ТРИВИЛИН: победа в партии! Ты выигрываешь сразу, а если у соперника не было очков — вдвойне. У тебя три пятёрки: нажми тривилин."],["Конец раздачи","Когда колода заканчивается, последний бравший забирает остаток со стола. Затем считают карты: каждая карта сверх 20 даёт 1 очко (13 или 14 при 3 игроках, 10 в одиночной игре на 4)."],["Готово!","Теперь ты знаешь основы. Сыграй против ИИ «С подсказками»: он подскажет твоё объявление и напомнит его повторить."]],
zh:[["纸牌","Caída 使用40张西班牙纸牌：1到7、侍从(10)、骑士(11)和国王(12)，共四种花色：金币、圣杯、宝剑和权杖。最先达到牌桌分数（24、30或40）的人获胜。按向右的顺序出牌。"],["开局：1或4","发牌者在桌上放4张牌，先说「一」（递增1-2-3-4）或「四」（递减4-3-2-1）。如果某张牌正好落在它的数字上就算「命中」，得到相应分数。点击「4 ↓」。"],["拿牌","轮到你时出一张牌。如果桌上有相同的牌，就把它拿走，连同按顺序接着的牌（5、6、7…）。点击你的5。"],["落牌！","如果上一位玩家刚出了一张牌（发光的那张），而你有相同的牌，这就是落牌（CAÍDA），你得分：1到7得1分，侍从2分，骑士3分，国王4分。对手刚出了国王，快压上！"],["清桌","如果你拿走桌上所有的牌，就是清桌：+4分。最后一轮发牌时不算。点击能清空桌面的牌。"],["叫牌","你的3张牌的某些组合可以得分：对子、哨兵、顺子、注册（1、11和12）、同花和大房子或小房子。必须在出第一张牌之前叫。你有3、3和7：点击叫牌然后出一张牌。"],["重复叫牌","非常重要！每出一张牌都要重复你的叫牌。最后一张时说「亮我的…」。点击铃铛然后出牌。"],["作废","如果有人叫牌后在下一张牌时没有重复，你可以说「作废了！」：你得1分，他的叫牌作废。如果没人说，叫牌仍然有效。要专心！拉法叫了同花，出第二张牌时没有重复…"],["假叫牌","叫自己没有的牌型就是假叫牌。如果你识破，得2分且他的叫牌无效（你的有效）。但如果他确实有，分数归他。拉法叫了同花，却已经出了圣杯4和宝剑6…"],["我叫牌","如果你的叫牌分数能让你达到目标，出牌前点「我叫牌！」：比较所有叫牌，你的最好就立刻获胜。"],["三条","三张相同的牌就是三条（TRIVILÍN）：直接赢得对局！立刻获胜，如果对手零分则双倍计分。你有三张5：点击三条。"],["一局结束","牌堆用完后，最后拿牌的人拿走桌上剩下的牌。然后数牌：超过20张的每张牌得1分（3人时为13或14张，4人个人赛为10张）。"],["准备好了！","现在你已掌握基础。和「带提示」的AI来一局吧：它会告诉你有什么叫牌，并提醒你重复。"]],
ja:[["カード","カイーダはスペインのカード40枚で遊びます：1〜7、ジャック(10)、騎士(11)、キング(12)。スートは金貨・聖杯・剣・棍棒の4種類。テーブルのポイント（24、30、40）に先に届いた人の勝ち。順番は右回りです。"],["オープニング：1か4","配る人はテーブルに4枚置く前に「イチ」（1-2-3-4と上がる）か「ヨン」（4-3-2-1と下がる）と宣言します。カードが自分の数字の位置に出たら「当たり」で、その数字のポイント。「4 ↓」をタップ。"],["カードを取る","自分の番にカードを1枚出します。テーブルに同じ数字があれば取れて、続く順番のカード（5、6、7…）も取れます。5をタップ。"],["カイーダ！","直前の人が出したカード（光っているもの）と同じ数字を持っていれば、それはカイーダ。1〜7は1点、ジャック2点、騎士3点、キング4点。相手がキングを出しました。決めよう！"],["テーブルクリア","テーブルのカードを全部取るとテーブルクリア：+4点。最後の配りでは無効です。テーブルを空にするカードをタップ。"],["役","3枚の組み合わせで得点になる役があります：ペア、見張り、ストレート、レジストロ（1・11・12）、フラッシュ（同じスート）、大きな家・小さな家。最初のカードを出す前に宣言します。3、3、7を持っています：役をタップしてからカードを出そう。"],["役をくり返す","とても大事！カードを出すたびに役をくり返し宣言します。最後のカードでは「見せた…」と言います。ベルをタップしてからカードを出そう。"],["バーン","誰かが役を宣言して次のカードでくり返さなかったら「バーン！」と言えます：1点もらえて、その役は無効に。誰も言わなければ役は有効のまま。よく見ていよう！ラファはフラッシュを宣言したのに、2枚目でくり返しませんでした…"],["嘘コール","持っていない役を宣言するのは嘘コール。見破れば2点で、相手の役は無効（あなたの役は有効）。でも本当に持っていたら1点は相手に。ラファはフラッシュを宣言したのに、聖杯の4と剣の6を出しています…"],["コール","役のポイントで目標に届くなら、出す前に「コール！」をタップ：役を比べて一番なら即勝利。"],["トリビリン","同じ数字3枚はトリビリン：その場で勝利！相手が0点なら2倍です。5を3枚持っています：トリビリンをタップ。"],["ハンドの終わり","山札がなくなったら、最後に取った人がテーブルの残りを取ります。そしてカードを数え、20枚を超えた分が1枚1点（3人なら13か14枚、4人個人戦なら10枚）。"],["準備完了！","基本はバッチリ。「ヒントあり」のAIと対戦しよう：持っている役を教えてくれて、くり返しも思い出させてくれます。"]]});
Object.assign(EXPT,{fr:{ronda:"2 cartes égales et une autre. Vaut 1 point du 1 au 7, 2 pour le 10, 3 pour le 11 et 4 pour le 12.","vigía":"Une paire plus une carte juste au-dessus ou en dessous. Vaut 7 points.",patrulla:"3 cartes qui se suivent. Vaut 6 points.",registro:"Le 1, le 11 et le 12. Vaut 8 points.","casa grande":"Deux 12 et un 1. Vaut 12 points.","casa chica":"Deux 1 et un 12. Vaut 12 points.",flor:"3 cartes de la même couleur. Vaut 10 points.","flor patrulla":"Une suite de la même couleur : on annonce couleur et suite. Vaut 16 points.","flor registro":"Un registre de la même couleur : on annonce couleur et registre. Vaut 18 points.","trivilín":"3 cartes égales. Tu gagnes la partie !"},
de:{ronda:"2 gleiche Karten und eine beliebige. 1 Punkt für 1–7, 2 für die 10, 3 für die 11 und 4 für die 12.","vigía":"Ein Paar plus eine direkt folgende oder vorherige Karte. 7 Punkte.",patrulla:"3 Karten in Folge. 6 Punkte.",registro:"Die 1, die 11 und die 12. 8 Punkte.","casa grande":"Zwei 12er und eine 1. 12 Punkte.","casa chica":"Zwei 1er und eine 12. 12 Punkte.",flor:"3 Karten gleicher Farbe. 10 Punkte.","flor patrulla":"Straße in einer Farbe: Flush und Straße ansagen. 16 Punkte.","flor registro":"Register in einer Farbe: Flush und Register ansagen. 18 Punkte.","trivilín":"3 gleiche Karten. Du gewinnst die Partie!"},
it:{ronda:"2 carte uguali e una qualsiasi. Vale 1 punto dall'1 al 7, 2 il 10, 3 l'11 e 4 il 12.","vigía":"Una coppia più una carta subito sopra o sotto. Vale 7 punti.",patrulla:"3 carte in fila. Vale 6 punti.",registro:"L'1, l'11 e il 12. Vale 8 punti.","casa grande":"Due 12 e un 1. Vale 12 punti.","casa chica":"Due 1 e un 12. Vale 12 punti.",flor:"3 carte dello stesso seme. Vale 10 punti.","flor patrulla":"Scala dello stesso seme: si dichiara colore e scala. Vale 16 punti.","flor registro":"Registro dello stesso seme: si dichiara colore e registro. Vale 18 punti.","trivilín":"3 carte uguali. Vinci la partita!"},
ru:{ronda:"2 одинаковые карты и любая другая. 1 очко за 1–7, 2 за 10, 3 за 11 и 4 за 12.","vigía":"Пара плюс соседняя по порядку карта. 7 очков.",patrulla:"3 карты подряд. 6 очков.",registro:"1, 11 и 12. 8 очков.","casa grande":"Две 12 и одна 1. 12 очков.","casa chica":"Две 1 и одна 12. 12 очков.",flor:"3 карты одной масти. 10 очков.","flor patrulla":"Стрит одной масти: объявляют флеш и стрит. 16 очков.","flor registro":"Регистр одной масти: объявляют флеш и регистр. 18 очков.","trivilín":"3 одинаковые карты. Ты выигрываешь партию!"},
zh:{ronda:"2张相同的牌加任意1张。1到7得1分，10得2分，11得3分，12得4分。","vigía":"一个对子加一张紧挨着的牌。7分。",patrulla:"3张连续的牌。6分。",registro:"1、11和12。8分。","casa grande":"两张12和一张1。12分。","casa chica":"两张1和一张12。12分。",flor:"3张同花色的牌。10分。","flor patrulla":"同花色的顺子：叫同花和顺子。16分。","flor registro":"同花色的注册：叫同花和注册。18分。","trivilín":"3张相同的牌。直接赢得对局！"},
ja:{ronda:"同じ数字2枚と任意の1枚。1〜7は1点、10は2点、11は3点、12は4点。","vigía":"ペアに続く数字か前の数字を1枚。7点。",patrulla:"連続した3枚。6点。",registro:"1・11・12。8点。","casa grande":"12が2枚と1が1枚。12点。","casa chica":"1が2枚と12が1枚。12点。",flor:"同じスート3枚。10点。","flor patrulla":"同じスートのストレート：フラッシュとストレートを宣言。16点。","flor registro":"同じスートのレジストロ：フラッシュとレジストロを宣言。18点。","trivilín":"同じ数字3枚。その場で勝利！"}});
const RULX={en:"<h3>Basics</h3><p>Spanish deck of 40 cards (no 8s or 9s). The first to reach the table points (24, 30 or 40) wins. Everyone gets 3 cards and 4 go on the table; when hands are empty, 3 more are dealt.</p><h3>Opening</h3><p>The dealer says 1 or 4. With 1 the cards should come out 1, 2, 3, 4; with 4: 4, 3, 2, 1. Each hit scores its number. If none hits, the rival gets 1 point (bad deal).</p><h3>Playing</h3><p>One card per turn. If it matches a table card you take it plus the following ones in order. Caída: matching the card the previous player just played. 1–7 = 1 point, jack 2, horse 3, king 4. Clean table: +4 (not in the last deal).</p><h3>Calls</h3><p>Call before your first card and repeat it on every card (“seen my…” on the last). Pair 1–4, lookout 7, straight 6, registry 8, flush 10, big or small house 12, flush straight 16, flush registry 18. Trivilín (three equal cards) wins the game, double if the rival has 0.</p><h3>Burned and false call</h3><p>If someone does not repeat a call, say “Burned!” (+1). If someone calls what they do not have, say “False call!” (+2). Accusing wrongly gives the other player 1 point.</p><h3>End of the hand</h3><p>The last to capture takes what is left. Every card above 20 scores 1 point (13 or 14 with 3 players, 10 in 4-player solo).</p>",
pt:"<h3>O básico</h3><p>Baralho espanhol de 40 cartas (sem 8 e 9). Vence quem chegar primeiro aos pontos da mesa (24, 30 ou 40). Cada um recebe 3 cartas e 4 vão para a mesa; quando as mãos acabam, dão-se mais 3.</p><h3>Abertura</h3><p>Quem dá diz 1 ou 4. Com 1 devem sair 1, 2, 3, 4; com 4: 4, 3, 2, 1. Cada acerto soma o seu número. Se nenhuma acerta, o rival ganha 1 ponto (má distribuição).</p><h3>Jogar</h3><p>Uma carta por vez. Se for igual a uma da mesa, você a leva junto com as seguintes em ordem. Caída: igual à carta que o jogador anterior acabou de jogar. 1–7 = 1 ponto, valete 2, cavalo 3, rei 4. Mesa limpa: +4 (não vale na última rodada).</p><h3>Cantos</h3><p>Cante antes da primeira carta e repita em cada carta (“vista minha…” na última). Par 1–4, vigia 7, sequência 6, registro 8, flor 10, casa grande ou pequena 12, flor sequência 16, flor registro 18. Trivilín (três cartas iguais) vence a partida, dobrado se o rival tiver 0.</p><h3>Queimou e canto falso</h3><p>Se alguém não repete o canto, diga “Queimou!” (+1). Se alguém canta o que não tem, diga “Canto falso!” (+2). Acusar errado dá 1 ponto ao outro.</p><h3>Fim da mão</h3><p>Quem capturou por último leva o que sobrou. Cada carta acima de 20 vale 1 ponto (13 ou 14 com 3 jogadores, 10 no individual de 4).</p>",
fr:"<h3>Les bases</h3><p>Jeu espagnol de 40 cartes (sans 8 ni 9). Le premier à atteindre les points de la table (24, 30 ou 40) gagne. Chacun reçoit 3 cartes et 4 vont sur la table ; quand les mains sont vides, on redonne 3 cartes.</p><h3>Ouverture</h3><p>Le donneur dit 1 ou 4. Avec 1 les cartes doivent sortir 1, 2, 3, 4 ; avec 4 : 4, 3, 2, 1. Chaque carte qui touche rapporte son numéro. Si aucune ne touche, l'adversaire gagne 1 point (mauvaise donne).</p><h3>Jouer</h3><p>Une carte par tour. Si elle est égale à une carte de la table, tu la prends avec les suivantes dans l'ordre. Caída : égale à la carte que le joueur précédent vient de jouer. 1–7 = 1 point, valet 2, cavalier 3, roi 4. Table nette : +4 (pas lors de la dernière donne).</p><h3>Annonces</h3><p>Annonce avant ta première carte et répète à chaque carte (« vu ma… » à la dernière). Paire 1–4, vigie 7, suite 6, registre 8, couleur 10, grande ou petite maison 12, suite couleur 16, registre couleur 18. Le trivilín (trois cartes égales) gagne la partie, double si l'adversaire a 0.</p><h3>Brûlé et fausse annonce</h3><p>Si quelqu'un ne répète pas son annonce, dis « Brûlé ! » (+1). Si quelqu'un annonce ce qu'il n'a pas, dis « Fausse annonce ! » (+2). Accuser à tort donne 1 point à l'autre.</p><h3>Fin de la donne</h3><p>Le dernier à capturer prend ce qui reste. Chaque carte au-delà de 20 vaut 1 point (13 ou 14 à 3 joueurs, 10 en individuel à 4).</p>",
de:"<h3>Grundlagen</h3><p>Spanisches Blatt mit 40 Karten (ohne 8 und 9). Wer zuerst die Punkte des Tisches erreicht (24, 30 oder 40), gewinnt. Jeder bekommt 3 Karten, 4 kommen auf den Tisch; sind die Hände leer, werden 3 neue gegeben.</p><h3>Eröffnung</h3><p>Der Geber sagt 1 oder 4. Bei 1 sollen die Karten 1, 2, 3, 4 kommen; bei 4: 4, 3, 2, 1. Jeder Treffer zählt seine Zahl. Trifft keine, bekommt der Gegner 1 Punkt (schlecht gegeben).</p><h3>Spielen</h3><p>Eine Karte pro Zug. Gleicht sie einer Tischkarte, nimmst du sie samt der folgenden in Reihe. Caída: gleich der Karte, die der vorige Spieler gerade gespielt hat. 1–7 = 1 Punkt, Bube 2, Pferd 3, König 4. Leerer Tisch: +4 (nicht im letzten Geben).</p><h3>Ansagen</h3><p>Vor der ersten Karte ansagen und bei jeder Karte wiederholen („gesehen mein…“ bei der letzten). Paar 1–4, Wache 7, Straße 6, Register 8, Flush 10, großes oder kleines Haus 12, Flush-Straße 16, Flush-Register 18. Trivilín (drei gleiche Karten) gewinnt die Partie, doppelt bei 0 Punkten des Gegners.</p><h3>Verbrannt und falsche Ansage</h3><p>Wiederholt jemand seine Ansage nicht, sag „Verbrannt!“ (+1). Sagt jemand etwas an, das er nicht hat, sag „Falsche Ansage!“ (+2). Wer falsch beschuldigt, gibt dem anderen 1 Punkt.</p><h3>Ende der Runde</h3><p>Wer zuletzt genommen hat, nimmt den Rest. Jede Karte über 20 zählt 1 Punkt (13 oder 14 bei 3 Spielern, 10 im Einzelspiel zu viert).</p>",
it:"<h3>Le basi</h3><p>Mazzo spagnolo di 40 carte (senza 8 e 9). Vince chi arriva per primo ai punti del tavolo (24, 30 o 40). Ognuno riceve 3 carte e 4 vanno sul tavolo; quando le mani finiscono se ne danno altre 3.</p><h3>Apertura</h3><p>Chi distribuisce dice 1 o 4. Con 1 le carte devono uscire 1, 2, 3, 4; con 4: 4, 3, 2, 1. Ogni carta che prende vale il suo numero. Se nessuna prende, l'avversario guadagna 1 punto (mala distribuzione).</p><h3>Giocare</h3><p>Una carta per turno. Se è uguale a una del tavolo la prendi con quelle che seguono in ordine. Caída: uguale alla carta appena giocata dal giocatore precedente. 1–7 = 1 punto, fante 2, cavallo 3, re 4. Tavolo pulito: +4 (non nell'ultima distribuzione).</p><h3>Dichiarazioni</h3><p>Dichiara prima della prima carta e ripeti a ogni carta («vista la mia…» all'ultima). Coppia 1–4, vedetta 7, scala 6, registro 8, colore 10, casa grande o piccola 12, scala colore 16, registro colore 18. Il trivilín (tre carte uguali) vince la partita, doppio se l'avversario ha 0.</p><h3>Bruciato e dichiarazione falsa</h3><p>Se qualcuno non ripete la dichiarazione, di' «Bruciato!» (+1). Se qualcuno dichiara ciò che non ha, di' «Dichiarazione falsa!» (+2). Accusare a torto dà 1 punto all'altro.</p><h3>Fine della mano</h3><p>Chi ha preso per ultimo si porta il resto. Ogni carta oltre le 20 vale 1 punto (13 o 14 in 3 giocatori, 10 nell'individuale a 4).</p>",
ru:"<h3>Основы</h3><p>Испанская колода из 40 карт (без 8 и 9). Побеждает тот, кто первым наберёт очки стола (24, 30 или 40). Каждому раздают 3 карты, 4 кладут на стол; когда руки пусты, раздают ещё по 3.</p><h3>Открытие</h3><p>Раздающий говорит 1 или 4. При 1 карты должны выйти 1, 2, 3, 4; при 4: 4, 3, 2, 1. Каждое попадание даёт очки по номеру. Если ни одна не попала, сопернику 1 очко (плохая раздача).</p><h3>Игра</h3><p>Одна карта за ход. Если она совпадает с картой на столе, забираешь её и следующие по порядку. Каида: совпадение с картой, которую только что положил предыдущий игрок. 1–7 = 1 очко, валет 2, конь 3, король 4. Чистый стол: +4 (кроме последней раздачи).</p><h3>Объявления</h3><p>Объявляй до первой карты и повторяй на каждой («видна моя…» на последней). Пара 1–4, дозор 7, стрит 6, регистр 8, флеш 10, большой или малый дом 12, флеш-стрит 16, флеш-регистр 18. Тривилин (три одинаковые карты) — победа, вдвойне если у соперника 0.</p><h3>Сгорело и ложное объявление</h3><p>Если кто-то не повторил объявление, скажи «Сгорело!» (+1). Если кто-то объявил то, чего нет, скажи «Ложное объявление!» (+2). Ошибочное обвинение даёт другому 1 очко.</p><h3>Конец раздачи</h3><p>Последний бравший забирает остаток. Каждая карта сверх 20 — 1 очко (13 или 14 при 3 игроках, 10 в одиночной игре на 4).</p>",
zh:"<h3>基础</h3><p>使用40张西班牙纸牌（没有8和9）。最先达到牌桌分数（24、30或40）的人获胜。每人发3张，桌上放4张；手牌出完后再各发3张。</p><h3>开局</h3><p>发牌者说1或4。说1时牌应依次出现1、2、3、4；说4时为4、3、2、1。每命中一张得到该数字的分数。一张都没中，对手得1分（发牌失误）。</p><h3>出牌</h3><p>每回合出一张。与桌上某张相同就拿走它及按顺序接着的牌。落牌：与上一位玩家刚出的牌相同。1–7得1分，侍从2分，骑士3分，国王4分。清桌：+4（最后一轮不算）。</p><h3>叫牌</h3><p>在出第一张牌前叫，并在每张牌时重复（最后一张说「亮我的…」）。对子1–4，哨兵7，顺子6，注册8，同花10，大房子或小房子12，同花顺16，同花注册18。三条（三张相同）直接获胜，对手0分时双倍。</p><h3>作废与假叫牌</h3><p>有人没重复叫牌，就说「作废了！」（+1）。有人叫了自己没有的，就说「假叫牌！」（+2）。冤枉别人则对方得1分。</p><h3>一局结束</h3><p>最后拿牌的人拿走剩余的牌。超过20张的每张牌得1分（3人时13或14张，4人个人赛10张）。</p>",
ja:"<h3>基本</h3><p>スペインのカード40枚（8と9なし）。テーブルのポイント（24、30、40）に先に届いた人の勝ち。各自3枚配り、テーブルに4枚。手札がなくなったらまた3枚ずつ配ります。</p><h3>オープニング</h3><p>配る人は1か4を宣言。1なら1・2・3・4、4なら4・3・2・1の順に出れば当たり。当たるたびにその数字のポイント。1枚も当たらなければ相手に1点（配り失敗）。</p><h3>プレイ</h3><p>1ターンに1枚。テーブルと同じ数字なら、それと順番に続くカードを取れます。カイーダ：直前の人が出したカードと同じ数字。1〜7は1点、ジャック2点、騎士3点、キング4点。テーブルクリア：+4（最後の配りでは無効）。</p><h3>役</h3><p>最初のカードの前に宣言し、毎回くり返します（最後は「見せた…」）。ペア1〜4、見張り7、ストレート6、レジストロ8、フラッシュ10、大きな家・小さな家12、フラッシュストレート16、フラッシュレジストロ18。トリビリン（同じ数字3枚）で即勝利、相手が0点なら2倍。</p><h3>バーンと嘘コール</h3><p>役をくり返さなかったら「バーン！」（+1）。持っていない役を宣言したら「嘘コール！」（+2）。間違った指摘は相手に1点。</p><h3>ハンドの終わり</h3><p>最後に取った人が残りを取ります。20枚を超えた分が1枚1点（3人なら13か14枚、4人個人戦は10枚）。</p>"};
const HOWX={es:"<h3>Paso a paso</h3><p>1. Toca JUGAR y elige Contra la IA (gratis) o una sala.</p><p>2. Si eres mano, di 1 o 4 y mira cómo sale la mesa.</p><p>3. Antes de tirar tu primera carta, toca los cantos que tengas.</p><p>4. Toca una carta para jugarla. Si hay una igual en la mesa, te la llevas.</p><p>5. Repite tu canto en cada carta y vigila los del rival: ¡Mal canto! o ¡Se quemó!</p><p>6. Llega primero a los puntos y gana oro.</p>",
en:"<h3>Step by step</h3><p>1. Tap PLAY and choose Vs AI (free) or a room.</p><p>2. If you lead, say 1 or 4 and watch the table.</p><p>3. Before your first card, tap the calls you have.</p><p>4. Tap a card to play it. If there is an equal one on the table, you take it.</p><p>5. Repeat your call on every card and watch the rivals: “False call!” or “Burned!”.</p><p>6. Reach the points first and win gold.</p>",
pt:"<h3>Passo a passo</h3><p>1. Toque JOGAR e escolha Contra a IA (grátis) ou uma sala.</p><p>2. Se você for mão, diga 1 ou 4 e veja a mesa.</p><p>3. Antes da primeira carta, toque os cantos que tiver.</p><p>4. Toque uma carta para jogá-la. Se houver uma igual na mesa, você a leva.</p><p>5. Repita seu canto em cada carta e vigie os rivais: “Canto falso!” ou “Queimou!”.</p><p>6. Chegue primeiro aos pontos e ganhe ouro.</p>",
fr:"<h3>Pas à pas</h3><p>1. Touche JOUER et choisis Contre l'IA (gratuit) ou un salon.</p><p>2. Si tu es la main, dis 1 ou 4 et regarde la table.</p><p>3. Avant ta première carte, touche tes annonces.</p><p>4. Touche une carte pour la jouer. S'il y en a une égale sur la table, tu la prends.</p><p>5. Répète ton annonce à chaque carte et surveille les adversaires : « Fausse annonce ! » ou « Brûlé ! ».</p><p>6. Atteins les points en premier et gagne de l'or.</p>",
de:"<h3>Schritt für Schritt</h3><p>1. Tippe auf SPIELEN und wähle Gegen KI (kostenlos) oder einen Raum.</p><p>2. Bist du Vorhand, sag 1 oder 4 und schau auf den Tisch.</p><p>3. Tippe vor deiner ersten Karte deine Ansagen an.</p><p>4. Tippe eine Karte zum Spielen. Liegt eine gleiche auf dem Tisch, nimmst du sie.</p><p>5. Wiederhole deine Ansage bei jeder Karte und beobachte die Gegner: „Falsche Ansage!“ oder „Verbrannt!“.</p><p>6. Erreiche zuerst die Punkte und gewinne Gold.</p>",
it:"<h3>Passo dopo passo</h3><p>1. Tocca GIOCA e scegli Contro l'IA (gratis) o una sala.</p><p>2. Se sei di mano, di' 1 o 4 e guarda il tavolo.</p><p>3. Prima della prima carta, tocca le tue dichiarazioni.</p><p>4. Tocca una carta per giocarla. Se ce n'è una uguale sul tavolo, la prendi.</p><p>5. Ripeti la dichiarazione a ogni carta e controlla gli avversari: «Dichiarazione falsa!» o «Bruciato!».</p><p>6. Arriva per primo ai punti e vinci oro.</p>",
ru:"<h3>Шаг за шагом</h3><p>1. Нажми ИГРАТЬ и выбери Против ИИ (бесплатно) или комнату.</p><p>2. Если ходишь первым, скажи 1 или 4 и смотри на стол.</p><p>3. До первой карты нажми свои объявления.</p><p>4. Нажми карту, чтобы сыграть. Если на столе есть такая же, забираешь её.</p><p>5. Повторяй объявление на каждой карте и следи за соперниками: «Ложное объявление!» или «Сгорело!».</p><p>6. Набери очки первым и выиграй золото.</p>",
zh:"<h3>步骤</h3><p>1. 点击「开始游戏」，选择对战AI（免费）或房间。</p><p>2. 如果你先手，说1或4并观察牌桌。</p><p>3. 出第一张牌前，点击你拥有的叫牌。</p><p>4. 点一张牌打出。桌上有相同的牌就拿走。</p><p>5. 每张牌都要重复叫牌，并留意对手：「假叫牌！」或「作废了！」。</p><p>6. 最先达到分数，赢取金币。</p>",
ja:"<h3>遊び方</h3><p>1. 「プレイ」をタップし、AI対戦（無料）かルームを選ぶ。</p><p>2. 親なら1か4を宣言してテーブルを見る。</p><p>3. 最初のカードを出す前に、持っている役をタップ。</p><p>4. カードをタップして出す。テーブルに同じ数字があれば取れる。</p><p>5. 毎回役をくり返し、相手もチェック：「嘘コール！」か「バーン！」。</p><p>6. 先にポイントに届いてゴールドを獲得。</p>"};
function tsT(i){const T=TSL[store.lang],L=TS[i];return T&&T[i]?{t:T[i][0],x:T[i][1],rival:L.rival}:L}
let TU={i:0,st:0,hand:[],table:[],btns:[],pts:0,fb:'',done:false,busy:false,last:null};
const mkC=a=>({id:a[1]*100+a[0],n:a[0],s:a[1]});
function tutLoad(i){const L=TS[i];TU={i,st:0,pts:i?TU.pts:0,hand:(L.hand||[]).map(mkC),table:(L.table||[]).map(mkC),btns:L.btns||[],fb:'',done:!L.seq||!L.seq.length,busy:false,last:L.last||null};
if(L.final){store.tutDone=1;save();setTimeout(checkAch,600)}showMenu('guia');setTimeout(()=>speak(tsT(i).t),300)}
function tutHTML(bk){const L=TS[TU.i];
let h=`<button class="bk" onclick="showMenu('home')">← Salir del tutorial</button><div class="sub" style="text-align:center">Lección ${TU.i+1} de ${TS.length} · Puntos de práctica: ${TU.pts}</div><div class="tbar"><i style="width:${(TU.i+1)/TS.length*100}%"></i></div><h2>${tsT(TU.i).t}</h2><div class="box txt">🧑‍🏫 ${tsT(TU.i).x}</div>`;
if(L.final)return h+`<button class="mb" onclick="tutPlay()">🎓 Jugar con ayudas</button><button class="mb bk" onclick="tutLoad(0)">↺ Repetir tutorial</button>`;
h+=`<div class="board tboard" data-t="madera">${L.rival?`<div class="trv">${L.rival}</div>`:''}<div class="sub" style="text-align:center;color:#fff">Mesa</div><div class="row" id="ttb">${TU.table.length?TU.table.map(c=>TU.last==c.n?svgCard(c).replace('class="c','class="c lastc'):svgCard(c)).join(''):'<span class="sub" style="color:#fff">vacía</span>'}</div><div class="tbig" id="tbig"></div></div>`;
if(TU.hand.length)h+=`<div class="sub" style="text-align:center;margin-top:8px">Tus cartas</div><div class="row mine" id="thd">${TU.hand.map(svgCard).join('')}</div>`;
if(TU.btns.length&&!TU.done)h+=`<div class="cg" style="margin-top:8px">${TU.btns.map(b=>`<button onclick="tutBtn('${b}')">${b}</button>`).join('')}</div>`;
h+=`<div class="hint" style="margin-top:8px">${TU.fb}</div>`;
if(TU.done)h+=`<button class="mb" onclick="tutLoad(${TU.i+1})">Siguiente ▶</button>`;
return h}
function tutBind(){document.querySelectorAll('#thd .c').forEach(el=>el.onclick=()=>tutCard(+el.dataset.id))}
function tutBig(t){const e=$('tbig');if(!e)return;e.textContent=t;e.className='tbig';void e.offsetWidth;e.className='tbig on'}
function tutWrong(){TU.fb='❌ Esa no es. Lee la explicación y prueba otra vez.';sfx.lose();showMenu('guia')}
function tutOk(st){TU.fb='✅ '+(st.ok||'¡Bien!');if(st.pts)TU.pts+=st.pts;if(st.btns)TU.btns=st.btns;TU.st++;if(TU.st>=TS[TU.i].seq.length)TU.done=true;
showMenu('guia');if(st.big)tutBig(st.big);if(st.fx=='caida')sfx.caida(4);else sfx.hit();speak((st.big||st.ok||'').replace(/[¡!]/g,''))}
function tutCard(id){if(TU.done||TU.busy)return;const st=TS[TU.i].seq[TU.st];if(!st)return;const c=TU.hand.find(x=>x.id==id),w=st.want;
if(!(w.anycard||(w.card!=null&&c.n==w.card)))return tutWrong();
TU.hand=TU.hand.filter(x=>x!==c);const m=TU.table.find(x=>x.n==c.n);
if(m){const g=[m];let k=ORD.indexOf(m.n)+1;while(k<10){const x=TU.table.find(y=>y.n==ORD[k]);if(!x)break;g.push(x);k++}TU.table=TU.table.filter(x=>!g.includes(x));sfx.capture()}else{TU.table.push(c);sfx.flip()}
TU.last=null;tutOk(st)}

const MU={on:false,t:null,nx:0,i:0,g:null};
function musAC(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state=='suspended')AC.resume();return AC}catch(e){return null}}
const NF=n=>440*Math.pow(2,(n-69)/12);
const PROG=[[57,60,64],[50,57,62,65],[55,59,62],[48,55,60,64],[53,57,60],[50,57,62,65],[52,56,59,62],[57,60,64]];
function mnote(f,t,d,ty,v,lp){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
if(lp){const f2=a.createBiquadFilter();f2.type='lowpass';f2.frequency.value=lp;o.connect(f2).connect(g)}else o.connect(g);g.connect(MU.g);o.start(t);o.stop(t+d+.05)}
function musTick(){if(!MU.on||!AC)return;const E=.24;while(MU.nx<AC.currentTime+.35){const i=MU.i,bar=Math.floor(i/6)%8,sub=i%6,ch=PROG[bar],t=MU.nx,cyc=Math.floor(i/48)%2;
if(sub==0){mnote(NF(ch[0]-12),t,1.3,'sine',.5);ch.forEach(n=>mnote(NF(n),t,1.5,'sawtooth',.035,900))}
if(sub==2||sub==4)ch.forEach((n,k)=>mnote(NF(n),t+k*.012,.32,'triangle',.11,2600));
const pat=cyc?[2,3,1,2,0,1]:[0,1,2,1,2,3],tones=[...ch.slice(0,3).map(n=>n+12),ch[0]+24],n=tones[pat[sub]%tones.length];
if(!(sub==5&&bar%2))mnote(NF(n),t,.38,'triangle',sub%2?.07:.1,3400);
MU.nx+=E;MU.i++}}
function musStart(){if(MU.on||store.music===false||$('menu').style.display=='none')return;const a=musAC();if(!a)return;MU.g=a.createGain();MU.g.gain.setValueAtTime(0,a.currentTime);MU.g.gain.linearRampToValueAtTime(.16,a.currentTime+2.5);MU.g.connect(a.destination);MU.on=true;MU.nx=a.currentTime+.15;MU.i=0;MU.t=setInterval(musTick,80)}
function musStop(){if(!MU.on)return;MU.on=false;clearInterval(MU.t);const a=AC,g=MU.g;try{g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(g.gain.value,a.currentTime);g.gain.linearRampToValueAtTime(0,a.currentTime+.6);setTimeout(()=>g.disconnect(),900)}catch(e){}}

function fitTable(){const tb=$('tb');if(!tb)return;const els=[...tb.querySelectorAll('.c')],n=els.length;if(!n)return;const W=(tb.clientWidth||220)-14,base=N>2?48:58,gap=6;
let H=(tb.clientHeight||150)-6;try{const p0=$('p0'),av=p0.getBoundingClientRect().top-tb.getBoundingClientRect().top-8;if(av>40&&av<H)H=av}catch(e){}let rows=(W-(n-1)*gap)/n>=(N>2?40:46)?1:2;if(n>10)rows=3;const per=Math.ceil(n/rows);let w=Math.max(26,Math.min(base,Math.floor((W-(per-1)*gap)/per)));const maxW=Math.floor((H-(rows-1)*gap)/rows/1.47);if(w>maxW)w=Math.max(24,maxW);const h=Math.round(w*1.47);els.forEach(e=>{e.style.width=w+'px';e.style.height=h+'px'})}

const GM={on:false,t:null,nx:0,i:0,g:null,lvl:0,hot:false};
const GPROG=[[50,53,57],[46,50,53],[48,52,55],[45,49,52]];
function gnz(t,d,f,v){const a=AC,s=a.createBufferSource();s.buffer=NB;const fl=a.createBiquadFilter();fl.type='highpass';fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(GM.g);s.start(t);s.stop(t+d+.02)}
function gkick(t,v){const a=AC,o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(GM.g);o.start(t);o.stop(t+.32)}
function gn(f,t,d,ty,v,lp){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
if(lp){const f2=a.createBiquadFilter();f2.type='lowpass';f2.frequency.value=lp;o.connect(f2).connect(g)}else o.connect(g);g.connect(GM.g);o.start(t);o.stop(t+d+.05)}
function gmTick(){if(!GM.on||!AC)return;
while(GM.nx<AC.currentTime+.35){const L=GM.lvl,E=[.3,.22,.165][L],i=GM.i,bar=Math.floor(i/8)%4,st=i%8,ch=GPROG[bar],t=GM.nx,up=L==2&&Math.floor(i/32)%2?1:0,c=ch.map(n=>n+up);
if(st==0){gn(NF(c[0]-12),t,E*7,'sine',.35);gn(NF(c[0]),t,E*3,'triangle',.14,1200);c.forEach(n=>gn(NF(n),t,E*8,'sawtooth',L?.03:.035,L==2?1800:L?1300:1100))}
if(L==0){if(st==2||st==6)c.forEach((n,k)=>gn(NF(n+12),t+k*.015,.45,'triangle',.12,3000));const mel=[0,null,2,1,null,2,1,null];if(mel[st]!=null)gn(NF(c[mel[st]]+24),t,.55,'triangle',.11,4000);if(st==4)gnz(t,.08,4000,.07)}
if(L>=1){gn(NF(c[0]-12),t,E*.8,'sine',.25);if(st%2)gnz(t,.05,6000,.12);if(st==4)gnz(t,.12,1500,.18);if(st%2==0)gn(NF(c[st/2%3]+12),t,E*1.6,'triangle',.06,3000)}

GM.nx+=E;GM.i++}}

function gmStop(){if(!GM.on)return;GM.on=false;clearInterval(GM.t);const a=AC,g=GM.g;try{g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(g.gain.value,a.currentTime);g.gain.linearRampToValueAtTime(0,a.currentTime+.8);setTimeout(()=>g.disconnect(),1000)}catch(e){}}

function chestPool(k){const T=['frame','name','av','table','back','face','fxc','fxk'];const all=t=>itemList(t).map(it=>[t,it]);
const EX=[...all('emo'),...all('snd').filter(x=>x[1].price!==0),...all('stk')];if(k=='emoG')return EX.filter(x=>!isG(x[1].price));if(k=='emoP')return EX.filter(x=>isG(x[1].price));
